name: Security audit

on:
  schedule:
    - cron: "11 6 * * 1" # Mondays 06:11 UTC
  workflow_dispatch:
  push:
    paths:
      - Cargo.lock

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
