name: API Watch
description: >-
  Catch breaking changes in the APIs you depend on, straight from CI.
  Compares each fetch against a stored baseline.
branding:
  icon: eye
  color: purple

inputs:
  spec:
    description: >-
      URL or local path of an OpenAPI 3.x, Swagger 2.0, or JSON document to
      track before checking. Re-adding an already-tracked name is a no-op, so
      this is safe with a warm cache.
    required: false
    default: ''
  name:
    description: 'Target name for `spec` (default: derived from the source).'
    required: false
    default: ''
  check-args:
    description: Arguments passed to `apiwatch check` (e.g. `--fail-on-breaking`).
    required: false
    default: ''
  db-path:
    description: SQLite database path. Cache this file between runs to keep the baseline.
    required: false
    default: '~/.apiwatch/apiwatch.db'

runs:
  using: composite
  steps:
    # Prefers the prebuilt binary attached to the release matching the action
    # ref (e.g. @v0.3.0). Anything else — a branch or SHA ref, `uses: ./`,
    # an unsupported platform, or a release without binaries — falls back to
    # building from source below.
    - name: Try prebuilt binary
      id: prebuilt
      shell: bash
      continue-on-error: true
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        case "$ACTION_REF" in
          refs/tags/v[0-9]*) tag="${ACTION_REF#refs/tags/}" ;;
          v[0-9]*) tag="$ACTION_REF" ;;
          *)
            echo "action ref '$ACTION_REF' is not a version tag; building from source"
            exit 1
            ;;
        esac
        os="$(uname -s)"
        arch="$(uname -m)"
        windows=false
        case "$os" in
          Linux)
            target="x86_64-unknown-linux-gnu"
            ;;
          Darwin)
            if [[ "$arch" == "arm64" ]]; then
              target="aarch64-apple-darwin"
            else
              target="x86_64-apple-darwin"
            fi
            ;;
          MINGW*|MSYS*|CYGWIN*)
            target="x86_64-pc-windows-msvc"
            windows=true
            ;;
          *)
            echo "unsupported platform ($os/$arch); building from source"
            exit 1
            ;;
        esac
        suffix=""
        if [[ "$windows" == "true" ]]; then
          suffix=".exe"
        fi
        asset="apiwatch-${target}.tar.gz"
        url="https://github.com/${ACTION_REPO}/releases/download/${tag}/${asset}"
        tmp="$(mktemp -d)"
        echo "downloading $url"
        curl -fsSL "$url" -o "$tmp/$asset"
        tar -xzf "$tmp/$asset" -C "$tmp"
        bin_dir="$RUNNER_TEMP/hix-bin"
        if command -v cygpath >/dev/null 2>&1; then
          bin_dir="$(cygpath -u "$RUNNER_TEMP")/hix-bin"
        fi
        mkdir -p "$bin_dir"
        install "$tmp/apiwatch-${target}/apiwatch${suffix}" "$bin_dir/"
        "$bin_dir/apiwatch${suffix}" --version
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "installed prebuilt binary for $target"

    - name: Install Rust toolchain
      if: ${{ steps.prebuilt.outputs.found != 'true' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Install API Watch from source
      if: ${{ steps.prebuilt.outputs.found != 'true' }}
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH"

    - name: Run API Watch
      shell: bash
      env:
        AW_SPEC: ${{ inputs.spec }}
        AW_NAME: ${{ inputs.name }}
        AW_CHECK_ARGS: ${{ inputs.check-args }}
        AW_DB: ${{ inputs.db-path }}
      run: |
        export APIWATCH_DB="${AW_DB/#\~/$HOME}"

        if [[ -n "$AW_SPEC" ]]; then
          add_args=()
          if [[ -n "$AW_NAME" ]]; then
            add_args+=(--name "$AW_NAME")
          fi
          # Re-adding an already-tracked name with the same URL and headers is
          # a no-op, so this is safe with a warm cache.
          apiwatch add "$AW_SPEC" "${add_args[@]}"
        fi

        # AW_CHECK_ARGS is deliberately word-split so callers can pass several flags.
        # shellcheck disable=SC2086
        exec apiwatch check $AW_CHECK_ARGS
