[package]
name = "apiwatch"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Catch breaking changes in the APIs you depend on"
license = "MIT"
repository = "https://github.com/hix-pro/api-watch"
homepage = "https://github.com/hix-pro/api-watch"
keywords = ["openapi", "api", "diff", "cli", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "gzip",
    "brotli",
    "default-tls",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.release]
lto = "thin"
strip = true
